<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#121226" />
      <stop offset="100%" stop-color="#1a1438" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="50%" stop-color="#5c8cff" />
      <stop offset="100%" stop-color="#3cd4f0" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glow1)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Ring Nodes -->
  <g filter="url(#neon)">
    <!-- Central Hexagonal / Connected Node Pattern -->
    <circle cx="256" cy="140" r="28" fill="#7c5cff" />
    <circle cx="160" cy="270" r="26" fill="#5c8cff" />
    <circle cx="352" cy="270" r="26" fill="#3cd4f0" />
    <circle cx="200" cy="380" r="22" fill="#4cdf86" />
    <circle cx="312" cy="380" r="22" fill="#7c5cff" />

    <!-- Connecting Link Lines -->
    <path d="M256 140 L160 270 M256 140 L352 270 M160 270 L352 270 M160 270 L200 380 M352 270 L312 380 M200 380 L312 380" 
          stroke="url(#glow1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Central Core Energy -->
    <circle cx="256" cy="250" r="14" fill="#ffffff" />
    <path d="M256 250 L256 140 M256 250 L160 270 M256 250 L352 270" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="6,4" />
  </g>

  <!-- Central Symbol Accent: DNA / Chain Link -->
  <g transform="translate(230, 224) scale(1.6)">
    <path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
